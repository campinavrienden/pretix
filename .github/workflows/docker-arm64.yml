name: Build pretix Docker release

run-name: Build pretix ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pretix release tag, e.g. v2026.7.0"
        required: true
        type: string

  workflow_call:
    inputs:
      release_tag:
        description: "Pretix release tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.release_tag }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: v2026.7.0"
            exit 1
          fi

          VERSION="${TAG#v}"
          MAJOR="${BASH_REMATCH[1]}"

          if (( MAJOR < 5 )); then
            echo "Pretix version $VERSION is older than 5.x"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


  build-amd64:
    name: Build AMD64
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-amd64
          cache-from: type=gha,scope=pretix-amd64
          cache-to: type=gha,mode=max,scope=pretix-amd64


  build-arm64:
    name: Build ARM64
    needs: validate
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-arm64
          cache-from: type=gha,scope=pretix-arm64
          cache-to: type=gha,mode=max,scope=pretix-arm64


  manifest:
    name: Create multi-platform images
    needs:
      - validate
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create version manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-arm64"

      - name: Create latest manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/pretix:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ needs.validate.outputs.version }}-arm64"
