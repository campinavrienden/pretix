name: Build pretix Docker release

run-name: Build pretix ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pretix release tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.release_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Determine Docker version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.release_tag }}"

          if [[ "$VERSION" != v* ]]; then
            echo "Invalid release tag: $VERSION"
            echo "Expected a tag starting with v"
            exit 1
          fi

          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable release: $VERSION"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"

          if (( MAJOR < 5 )); then
            echo "Pretix version $VERSION is older than 5.x"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push version
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pretix:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pretix:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
